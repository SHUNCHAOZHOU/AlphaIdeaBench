groups:
  validity:
    name: Validity
    description: >-
      Whether the idea reads the context correctly, states a clear problem,
      proposes a method that answers its own motivation, and makes claims that
      can be tested.
    dimensions:
      - context_grounding
      - problem_formulation
      - motivation_method_consistency
      - testability
  novelty:
    name: Novelty
    description: >-
      Whether the problem, method, scenario, and insight are new relative to the
      prior work given in the context.
    dimensions:
      - problem_novelty
      - method_novelty
      - scenario_novelty
      - insight_novelty
  feasibility:
    name: Feasibility
    description: >-
      Whether the technical plan, data, budget, and verification can actually be
      carried out under real constraints.
    dimensions:
      - technical_feasibility
      - data_feasibility
      - budget_feasibility
      - verification_feasibility

dimensions:
  context_grounding:
    index: 1
    group: validity
    name: Context Grounding
    question: >-
      Does the idea correctly understand and use the given research background,
      prior papers, and research direction?
    scores:
      "1": Largely detached from the given context, or contains serious factual errors; the problem is unrelated to the given direction
      "2": Superficially related to the context, but clearly misreads prior work, research goals, or limitations
      "3": Broadly understands the context, but only uses the general theme and does not use the key papers or research gaps accurately
      "4": Correctly understands prior work and identifies a research gap consistent with the context
      "5": Deeply and accurately synthesises the papers, limitations, and background in the context; the idea follows naturally from that context
    checklist:
      - text: Is the idea relevant to the given research direction
        polarity: positive
      - text: Are existing methods described accurately
        polarity: positive
      - text: Are the limitations of prior work identified correctly
        polarity: positive
      - text: Is key information from the context actually used
        polarity: positive
      - text: Is a problem already solved by prior work mistaken for an open problem
        polarity: negative
      - text: Are there factual errors about the papers
        polarity: negative
      - text: Does it introduce a key assumption absent from the context without explaining where it comes from
        polarity: negative
      - text: Are there fabricated papers, fabricated results, or incorrect citations
        polarity: negative

  problem_formulation:
    index: 2
    group: validity
    name: Problem Formulation
    question: >-
      Does the idea turn a broad direction into a clear, specific, well-bounded
      research problem?
    scores:
      "1": No clear research problem; only a topic, a slogan, or a wish
      "2": The general direction is visible, but the subject, conditions, goal, and boundaries are all vague
      "3": The problem is broadly understandable, but important qualifying conditions or key variables are still missing
      "4": Problem, subject, applicable conditions, and goal are reasonably clear, and the scope is roughly manageable
      "5": The research problem is defined precisely, with clear key variables, boundaries, assumptions, and goals; it could almost be turned directly into a formal research question
    checklist:
      - text: Is the object of study stated
        polarity: positive
      - text: Is the phenomenon or failure under study stated
        polarity: positive
      - text: Are the study conditions stated
        polarity: positive
      - text: Are the key variables stated
        polarity: positive
      - text: Is the research goal stated
        polarity: positive
      - text: Is there an explicit research question or hypothesis
        polarity: positive
      - text: Is it merely vague phrasing such as "improve performance", "enhance capability", or "solve robustness"
        polarity: negative
      - text: Are several unrelated problems mixed into one idea
        polarity: negative
      - text: Is the scope of the idea too large
        polarity: negative

  motivation_method_consistency:
    index: 3
    group: validity
    name: Motivation–Method Consistency
    question: >-
      Does the proposed method actually address the research gap identified in
      the motivation?
    scores:
      "1": Method and motivation are essentially unrelated; there is no visible reason the method would solve the problem
      "2": Method relates to the motivation only superficially and cannot address the core research gap
      "3": Method broadly responds to the motivation, but a key mechanism or logical link in between is missing
      "4": Method explicitly targets the core problem in the motivation, with a plausible mechanism of action
      "5": Motivation, hypothesis, method, and experiments form a closed loop; the method addresses the core bottleneck rather than a peripheral issue
    checklist:
      - text: Is the bottleneck identified by the motivation stated explicitly
        polarity: positive
        note: Name that bottleneck in the evidence field.
      - text: Does the method target that bottleneck directly
        polarity: positive
      - text: Can the method test the key hypothesis
        polarity: positive
      - text: If the method succeeds, would the original problem be alleviated
        polarity: positive
      - text: Is there a "motivation says A, method does B" mismatch
        polarity: negative
      - text: Is the method merely a module related to the problem without actually solving it
        polarity: negative
      - text: Would the planned experiments show that the method really solves the problem in the motivation
        polarity: positive

  testability:
    index: 4
    group: validity
    name: Testability
    question: >-
      Can the core scientific claim of this idea be clearly tested or falsified?
    scores:
      "1": No clear way to verify it; the core claim is essentially untestable
      "2": There is a rough experimental direction, but no clear variables, metrics, or decision criteria
      "3": A preliminary test is possible, but strong baselines, controls, or clear falsification criteria are missing
      "4": Clear hypothesis, experimental setup, evaluation metrics, and comparison targets
      "5": Rigorous falsifiable hypothesis, controlled variables, control conditions, success criteria, and analysis of alternative explanations
    checklist:
      - text: Is there an explicit hypothesis
        polarity: positive
      - text: Are there observable variables
        polarity: positive
      - text: Is there a measurable outcome
        polarity: positive
      - text: Is there a baseline
        polarity: positive
      - text: Is there a control condition
        polarity: positive
      - text: Is there an explicit success criterion
        polarity: positive
      - text: Could the results support or overturn the core claim
        polarity: positive
      - text: Can competing explanations be distinguished
        polarity: positive
      - text: Is "the model gets better" turned into a measurable metric
        polarity: positive
      - text: Are there untestable strong claims such as "truly understands" or "achieves general intelligence"
        polarity: negative

  problem_novelty:
    index: 5
    group: novelty
    name: Problem Novelty
    question: >-
      Is the research problem, phenomenon, failure mode, hypothesis, or research
      perspective new relative to prior work?
    scores:
      "1": "The problem has already been explicitly posed and largely solved in prior literature"
      "2": "Minor repackaging, cosmetic re-framing, or routine extension of an existing problem without posing a new fundamental question"
      "3": "Meaningful new angle or specific failure mode within an existing problem domain, but closely following established research trajectories"
      "4": "Distinctly new, well-defined research problem, non-obvious failure mode, or mechanistic question that challenges existing assumptions"
      "5": "Foundational new problem formulation or conceptual paradigm that defines an entirely new research area"
    checklist:
      - text: Has this problem already been studied or largely solved in existing literature
        polarity: negative
      - text: Is it only a cosmetic re-framing or routine change of dataset, model, or benchmark
        polarity: negative
      - text: Does it identify a genuinely new failure mode or unexplored bottleneck
        polarity: positive
      - text: Does it identify a new contradiction or challenge to existing assumptions
        polarity: positive
      - text: Does it pose a distinct, non-obvious research question
        polarity: positive
      - text: Does it propose a new problem boundary or object of study
        polarity: positive
      - text: Is there a substantive difference from closest prior work
        polarity: positive
        note: State that difference explicitly in the evidence field.

  method_novelty:
    index: 6
    group: novelty
    name: Method Novelty
    question: >-
      Is the algorithm, model, training procedure, experimental method, or
      theoretical tool used to solve the problem new?
    scores:
      "1": "The method essentially restates, directly adopts, or replicates existing methods with no substantive modification"
      "2": "Routine combination or minor adaptation: standard stitching of off-the-shelf modules, trivial backbone swap, or straightforward application of existing toolkits"
      "3": "Solid incremental method: meaningful procedural or architectural modification tailored to the problem, but the core mechanism remains within established paradigms"
      "4": "Non-obvious, substantive new method design: introduces a distinct, well-formulated new algorithmic formulation, loss objective, mechanism, or theoretical tool"
      "5": "Foundational or paradigm-shifting methodological breakthrough that establishes a fundamentally new computing, modeling, or learning principle"
    checklist:
      - text: Does the method already appear in existing papers or standard toolkits
        polarity: negative
      - text: Is it primarily a routine assembly or stitching of standard existing components (e.g. standard models, prompting, off-the-shelf RL/loss)
        polarity: negative
      - text: Is it only a backbone swap, hyperparameter tuning, or dataset swap
        polarity: negative
      - text: Is it only the addition of a common module without changing the core solving mechanism
        polarity: negative
      - text: Does the method introduce a non-obvious algorithmic delta beyond standard module combinations
        polarity: positive
      - text: Does it change the core solving mechanism or mathematical/algorithmic formulation
        polarity: positive
      - text: Is the new method specifically and non-trivially designed for the bottleneck of this idea
        polarity: positive
      - text: If it is a combination of methods, does that combination already have direct precedent or is it a routine pairing
        polarity: negative
        note: Answer n/a if the method is not a combination of existing methods.

  scenario_novelty:
    index: 7
    group: novelty
    name: Scenario Novelty
    question: >-
      Does the idea introduce a new domain, task, modality, data distribution,
      deployment environment, or real-world constraint, and does that give rise
      to a meaningful new research problem?
    scores:
      "1": "The scenario completely follows existing work, or is only renamed"
      "2": "Only the dataset, application domain, or input format changes; the core research problem and technical challenges are essentially unchanged"
      "3": "Introduces a new application domain, task, or constraint, but standard methods can be transferred directly without fundamental adaptations"
      "4": "The new scenario creates distinct, meaningful challenges that fundamentally require targeted method redesign rather than direct transfer"
      "5": "The new scenario opens an entirely new research frontier with unprecedented evaluation, modeling, or real-world requirements"
    checklist:
      - text: Is it a new domain, task, modality, or deployment environment
        polarity: positive
      - text: Is it just applying existing methods directly to a new dataset or domain without unique challenges
        polarity: negative
      - text: Does the new scenario introduce unique challenges that prevent standard direct transfer
        polarity: positive
      - text: Does the scenario necessitate targeted algorithmic or evaluation redesign
        polarity: positive
      - text: Does the new scenario change the underlying research problem
        polarity: positive

  insight_novelty:
    index: 8
    group: novelty
    name: Insight Novelty
    question: >-
      Does the idea offer a new understanding of a phenomenon, failure mode,
      method behaviour, or causal mechanism?
    scores:
      "1": "No new explanation; only describes a phenomenon, repeats known conclusions, or provides cosmetic explanations"
      "2": "Offers a generic, high-level, or templated explanation that does not reveal concrete mechanisms"
      "3": "Provides a specific empirical observation or preliminary mechanistic hypothesis, but remains close to existing understandings"
      "4": "Proposes a clear, non-obvious new mechanism, boundary condition, or causal explanation supported by concrete evidence or falsifiable claims"
      "5": "Reveals a foundational, non-obvious new principle or causal mechanism that alters how the field understands the phenomenon"
    checklist:
      - text: Does it propose a new mechanistic or causal explanation
        polarity: positive
      - text: Does it point to specific, verifiable causal factors
        polarity: positive
      - text: Does it identify a new failure mechanism or boundary condition
        polarity: positive
      - text: Does it disentangle factors previously conflated
        polarity: positive
      - text: Is it merely renaming an existing phenomenon or offering a generic explanation
        polarity: negative
      - text: Is it substantively different from existing explanations in the literature
        polarity: positive
      - text: Can the mechanistic claim be tested experimentally or theoretically
        polarity: positive

  technical_feasibility:
    index: 9
    group: feasibility
    name: Technical Feasibility
    question: Can the technical plan of this idea be implemented?
    scores:
      "1": Contains a fundamental technical contradiction, or depends on unobtainable information; essentially not implementable
      "2": Key technical components are missing; only a conceptual description, hard to implement
      "3": A simplified version or prototype is implementable, but the core plan still carries clear technical risk
      "4": The technical path is clear, the required components mostly exist, and it can reasonably be implemented
      "5": The implementation path is mature and complete, technical risk is low, and prototyping could start immediately
    checklist:
      - text: Do the required algorithms, models, and components exist
        polarity: positive
      - text: Is the method pipeline complete
        polarity: positive
      - text: Are inputs and outputs clearly defined
        polarity: positive
      - text: Does it depend on unobtainable information
        polarity: negative
      - text: Does it require an oracle
        polarity: negative
      - text: Are the training and inference loops closed
        polarity: positive
      - text: Are there self-contradictory assumptions
        polarity: negative
      - text: Can a prototype be built
        polarity: positive
      - text: Does it require solving an unmentioned core technical challenge
        polarity: negative

  data_feasibility:
    index: 10
    group: feasibility
    name: Data Feasibility
    question: >-
      Can the data, labels, ground truth, and data access this idea needs be
      obtained?
    scores:
      "1": The required data does not exist, cannot be obtained, or there is no workable ground truth
      "2": Major obstacles to obtaining data; requires large-scale collection, expert annotation, or access approval
      "3": Substitute data or a simplified version is possible, but data quality, scale, or representativeness is limited
      "4": The required data is largely obtainable, needing only routine cleaning, processing, or limited annotation
      "5": Data is public, sufficient, of suitable quality, with reliable labels, and can directly support verification
    checklist:
      - text: Does the data exist
        polarity: positive
      - text: Is it publicly available
        polarity: positive
      - text: Does new data need to be collected
        polarity: negative
      - text: Is expert annotation required
        polarity: negative
      - text: Is the amount of data sufficient
        polarity: positive
      - text: Is the data quality sufficient
        polarity: positive
      - text: Are there privacy, copyright, or ethical issues
        polarity: negative
      - text: Is there reliable ground truth
        polarity: positive
      - text: Can train, validation, and test splits be constructed
        polarity: positive
      - text: Could train-test leakage occur
        polarity: negative
      - text: Can the data really support the claim being verified
        polarity: positive

  budget_feasibility:
    index: 11
    group: feasibility
    name: Budget Feasibility
    question: >-
      Can this idea be completed under the compute, time, API, human-effort, and
      funding constraints specified by the benchmark?
    scores:
      "1": Clearly exceeds the stated budget; no meaningful verification is possible as things stand
      "2": Key resources are severely insufficient; it can only remain conceptual
      "3": A scaled-down proof-of-concept is possible, but full verification is not
      "4": Reasonable experiments can be completed within the given compute, time, and funding
      "5": Resource needs are clearly below budget, the experimental path is clear, and there is ample headroom for baselines, ablations, and repeated runs
    checklist:
      - text: Is GPU/CPU capacity sufficient
        polarity: positive
      - text: Is training time sufficient
        polarity: positive
      - text: Is inference cost affordable
        polarity: positive
      - text: Does the number of API calls exceed the budget
        polarity: negative
      - text: Is the human annotation cost affordable
        polarity: positive
      - text: Is there enough time for data collection and processing
        polarity: positive
      - text: Are special devices or a deployment environment required
        polarity: negative
      - text: Is there enough time for baselines, ablations, and repeated runs
        polarity: positive
      - text: Can a "meaningful verification" be completed within budget, not just a working demo
        polarity: positive

  verification_feasibility:
    index: 12
    group: feasibility
    name: Verification Feasibility
    question: >-
      Under real conditions, can a sufficiently credible experimental or
      theoretical verification be carried out?
    scores:
      "1": Credible verification is essentially impossible; data, metrics, baselines, or observable outcomes are missing
      "2": Only indirect, insufficient, or highly unreliable evidence can be obtained
      "3": Preliminary verification is possible, but experiment scale, controls, or measurement capability are limited
      "4": Clear, executable experimental procedure, baselines, metrics, and basic controls
      "5": A rigorous, reproducible verification plan that can distinguish alternative explanations and support falsification
    checklist:
      - text: Is there an executable experimental procedure
        polarity: positive
      - text: Is the required data obtainable
        polarity: positive
      - text: Are baselines implemented
        polarity: positive
      - text: Are the evaluation metrics appropriate
        polarity: positive
      - text: Can ablations be carried out
        polarity: positive
      - text: Can key variables be controlled
        polarity: positive
      - text: Can experiments be repeated
        polarity: positive
      - text: Can alternative explanations be ruled out
        polarity: positive
      - text: Is the resulting evidence strong enough to be credible rather than merely suggestive
        polarity: positive
        note: >-
          Judge evidential strength here. Whether resources fit the budget belongs
          to budget_feasibility; do not re-penalise the budget in this dimension.
      - text: Could the results support or refute the core claim
        polarity: positive
