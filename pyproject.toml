[project]
name = "alphaideabench"
version = "0.2.0"
description = "Twelve-dimension LLM judge for research ideas, plus human-review alignment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "numpy>=1.26",
  "openai>=1.40",
  "google-genai>=1.12",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
coverage = ["httpx>=0.27"]

[project.scripts]
alphaideabench = "alphaideabench.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
