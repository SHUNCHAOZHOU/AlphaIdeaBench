# GPT-5 mini via OpenRouter. Used to re-score Table 3 ideas (frozen).
# .env currently forces LLM_PROVIDER=gemini; the rejudge runner overrides
# LLM_PROVIDER / model / JUDGE_MODEL / OPENROUTER_API_KEY in the child env.
language: en

llm:
  provider: openrouter
  model: openai/gpt-5-mini
  api_key_env: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  base_url_env: OPENROUTER_BASE_URL
  timeout_s: 300
  max_retries: 4
  json_mode: false
  http_referer: https://github.com/alphaideabench
  app_title: AlphaIdeaBench

embedding:
  provider: openrouter
  model: google/gemini-embedding-2
  api_key_env: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  base_url_env: OPENROUTER_BASE_URL
  output_dim: 768
  task_prefix: "task: sentence similarity | query: "
  http_referer: https://github.com/alphaideabench
  app_title: AlphaIdeaBench

agents:
  judge:
    name: dimension_judge
    system_prompt: prompts/judge_system.md
    user_prompt: prompts/judge_user.md
    tools:
      - load_topic
      - load_budget
      - load_idea
      - load_rubric
    temperature: 0.3
    max_rounds: 8
    repeats: 1
    workers: 4
    model: openai/gpt-5-mini

track2:
  taus: [0.85, 0.90]
